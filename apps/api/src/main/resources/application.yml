server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  datasource:
    # From the environment when deployed (.env: APEX_DB_*); the defaults are the local development database.
    url: ${APEX_DB_URL:jdbc:postgresql://localhost:5432/apex_f1}
    username: ${APEX_DB_USER:kaushalparvatala}
    password: ${APEX_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

apex:
  openf1:
    base-url: https://api.openf1.org/v1
