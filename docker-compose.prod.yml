# Production overlay (docs/DEPLOYMENT.md):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Adds Caddy as the only public service (HTTPS on 80/443); the site, API and database are reachable only on the compose network.
# Needs Docker Compose 2.24 or newer (for !reset).
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN in .env}" }
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }

  postgres:
    ports: !reset []

  api:
    ports: !reset []

  web:
    ports: !reset []
    build:
      args:
        # Baked into the browser bundle at build time: the replay API through the same domain (Caddy routes /api/sessions/*).
        NEXT_PUBLIC_API_BASE_URL: "https://${DOMAIN:?set DOMAIN in .env}"
    environment:
      DATA_DIR: /data
      API_INTERNAL_URL: http://api:8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/data-status').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  sync:
    depends_on:
      web: { condition: service_healthy }

volumes:
  caddy_data:
  caddy_config:
